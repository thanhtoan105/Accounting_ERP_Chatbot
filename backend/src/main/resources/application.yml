server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: accounting-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/accounting_dev
    username: accounting
    password: accounting
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
    validate-on-migrate: true
  config:
    import:
      - optional:file:../.env[.properties]
      # - optional:file:.env[.properties]
  devtools:
    restart:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: redis
    redis:
      time-to-live: 300000 # 5 minutes in milliseconds (default, can be overridden per cache)

springdoc:
  swagger-ui:
    path: /api/docs

management:
  endpoints:
    web:
      exposure:
        include: 'health,info'

info:
  app:
    name: accounting-backend
    version: 0.0.1-SNAPSHOT

# Resend Email Configuration
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Application Configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production-minimum-256-bits}
  access-token-validity-minutes: ${JWT_ACCESS_TOKEN_VALIDITY_MINUTES:30}
  refresh-token-validity-days: ${JWT_REFRESH_TOKEN_VALIDITY_DAYS:7}

# Metabase Configuration
metabase:
  site-url: ${METABASE_SITE_URL:http://localhost:3000}
  embedding-secret: ${METABASE_EMBEDDING_SECRET:dev-secret-key-change-in-production}
  api-key: ${METABASE_API_KEY:}
  admin-email: ${METABASE_ADMIN_EMAIL:admin@example.com}
  admin-password: ${METABASE_ADMIN_PASSWORD:}
  db:
    host: ${METABASE_DB_HOST:postgres}
    port: ${METABASE_DB_PORT:5432}
    name: ${METABASE_DB_NAME:accounting_dev}

# AI Chatbot Configuration
chatbot:
  enabled: ${CHATBOT_ENABLED:true}

  # Azure OpenAI Configuration
  azure-openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:https://your-resource.openai.azure.com/}
    api-key: ${AZURE_OPENAI_API_KEY:}
    api-version: '2023-05-15'
    embedding-deployment: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:embedding-ada-002}
    completion-deployment: ${AZURE_OPENAI_COMPLETION_DEPLOYMENT:gpt-4o}
    max-tokens: ${AZURE_OPENAI_MAX_TOKENS:500}
    temperature: ${AZURE_OPENAI_TEMPERATURE:0.3}
    timeout-seconds: ${AZURE_OPENAI_TIMEOUT:30}

  # Pinecone Configuration
  pinecone:
    api-key: ${PINECONE_API_KEY:}
    environment: ${PINECONE_ENVIRONMENT:us-east-1-aws}
    index-name: ${PINECONE_INDEX_NAME:accounting-embeddings}
    namespace-prefix: 'company-'
    top-k: 10
    score-threshold: 0.7

  # n8n Webhook Configuration
  n8n:
    webhook-url: ${N8N_WEBHOOK_URL:https://n8n.duongthanhtoan105.com/webhook/voucher-embedding-v2}
    webhook-secret: ${N8N_WEBHOOK_SECRET:}
    retry-attempts: 3
    retry-delays: 1000,5000,15000 # milliseconds: 1s, 5s, 15s
    timeout-seconds: 10

  # Query Configuration
  query:
    max-length: 5000
    default-language: vi
    confidence-threshold-low: 0.5
    confidence-threshold-high: 0.8

  # Caching Configuration
  cache:
    enabled: ${REDIS_ENABLED:true}
    ttl-hours: 1

# Report Scheduling Configuration
reporting:
  schedule:
    check:
      cron: '0 */5 * * * *' # Every 5 minutes
  orphan:
    check:
      cron: '0 0 1 * * *' # Daily at 1 AM

# Dashboard ETL Configuration (Epic 8.0)
dashboard:
  etl:
    enabled: ${DASHBOARD_ETL_ENABLED:true}
    cron: ${DASHBOARD_ETL_CRON:0 */5 * * * *} # Every 5 minutes
    lock-ttl-seconds: ${DASHBOARD_ETL_LOCK_TTL:300} # 5 minutes lock timeout
    business-hours:
      enabled: ${DASHBOARD_ETL_BUSINESS_HOURS_ENABLED:false}
      start: ${DASHBOARD_ETL_BUSINESS_HOURS_START:8}
      end: ${DASHBOARD_ETL_BUSINESS_HOURS_END:18}
  refresh:
    rate-limit-seconds: ${DASHBOARD_REFRESH_RATE_LIMIT:60} # 1 refresh per minute per user

# Role-Based Dashboard Profiles (Epic 8.0.18)
analytics:
  export:
    large-export-threshold: ${ANALYTICS_LARGE_EXPORT_THRESHOLD:10000}
    download-expiry-hours: ${ANALYTICS_DOWNLOAD_EXPIRY_HOURS:24}
  dashboards:
    # IMPORTANT: Dashboard ID 4 is "Financial Overview" in Metabase
    # Dashboard ID 1 is the demo "E-commerce insights" dashboard
    default-dashboard-id: 4
    role-profiles:
      ADMIN: 4 # Full dashboard - Financial Overview with all widgets
      CFO: 4
      CHIEF_ACCOUNTANT: 4
      ACCOUNTANT_GENERAL: 4 # Financial Overview
      ACCOUNTANT_AR: 4 # Financial Overview (filtered by role permissions)
      ACCOUNTANT_AP: 4 # Financial Overview (filtered by role permissions)
      CASHIER: 4 # Financial Overview (filtered by role permissions)
      FINANCE: 4
      ACCOUNTANT: 4
