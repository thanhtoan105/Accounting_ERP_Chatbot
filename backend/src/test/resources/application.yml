spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: simple

# Metabase test configuration
metabase:
  site-url: http://localhost:3000
  embedding-secret: test-secret-key-for-testing
  api-key: test-api-key
  admin-email: test@example.com
  admin-password: testpass
  db:
    host: localhost
    port: 5432
    name: accounting_test

# JWT configuration
jwt:
  secret: test-jwt-secret-key-for-integration-tests-minimum-256-bits
  access-token-validity-minutes: 30
  refresh-token-validity-days: 7

# App configuration
app:
  frontend-url: http://localhost:5173

# Chatbot configuration (disabled for tests)
chatbot:
  enabled: false
  n8n:
    webhook-url: http://localhost:5678/webhook/voucher-embedding-v2
    batch-webhook-url: http://localhost:5678/webhook-test/batch
    rag-query-url: http://localhost:5678/webhook/chatbot-query-v2
    webhook-secret: test-secret
    retry-attempts: 3
    timeout-seconds: 30
  query:
    max-length: 5000
    default-language: vi
    confidence-threshold-low: 0.5
    confidence-threshold-high: 0.8

# Resend (email)
resend:
  api-key: test-key
  from-email: test@example.com
