services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: accounting-postgres
    command: postgres -c shared_preload_libraries=timescaledb,pg_stat_statements -c pg_stat_statements.track=all
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting
      POSTGRES_DB: accounting_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U accounting -d accounting_dev" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - accounting-net
      - n8n-network

  redis:
    image: redis:7-alpine
    container_name: accounting-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - accounting-net

  metabase-db:
    image: postgres:16-alpine
    container_name: accounting-metabase-db
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-metabase}
      POSTGRES_DB: metabase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    networks:
      - accounting-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  metabase:
    image: metabase/metabase:v0.50.36
    container_name: accounting-metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase}
      MB_DB_HOST: metabase-db
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:3000}
      MB_EMBEDDING_SECRET_KEY: ${METABASE_EMBEDDING_SECRET:-dev-secret-key-change-in-production}
      MB_JWT_SHARED_SECRET: ${METABASE_JWT_SECRET:-dev-jwt-secret-change-in-production}
      MB_JWT_ENABLED: "true"
      MB_JWT_IDENTITY_PROVIDER_URI: ""
      MB_JWT_ATTRIBUTE_EMAIL: email
      MB_JWT_ATTRIBUTE_FIRSTNAME: first_name
      MB_JWT_ATTRIBUTE_LASTNAME: last_name
      MB_JWT_ATTRIBUTE_GROUPS: groups
      MB_ENABLE_EMBEDDING: "true"
      # Security hardening
      MB_ENABLE_PUBLIC_SHARING: "false"
      MB_NATIVE_QUERY_DISABLED: "true"
      MB_SESSION_COOKIES: "true"
      MB_CHECK_FOR_UPDATES: "false"
      MB_PASSWORD_COMPLEXITY: strong
      MB_PASSWORD_LENGTH: 12
      # Session timeout in minutes
      MB_SESSION_TIMEOUT: 30
      # Query caching configuration
      MB_ENABLE_QUERY_CACHING: "true"
      MB_QUERY_CACHING_TTL_RATIO: "10"
      MB_QUERY_CACHING_MIN_TTL: "60"
      MB_QUERY_CACHING_MAX_TTL: 300
      JAVA_TIMEZONE: Asia/Ho_Chi_Minh
    depends_on:
      metabase-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - metabase-plugins:/plugins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - accounting-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 1G

  n8n:
    image: n8nio/n8n:latest
    container_name: accounting-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_API_KEY=${N8N_API_KEY}
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - accounting-net

volumes:
  pgdata:
  pgadmin-data:
  metabase-db-data:
  metabase-plugins:
  n8n-data:


networks:
  accounting-net:
    driver: bridge
  n8n-network:
    external: true 
